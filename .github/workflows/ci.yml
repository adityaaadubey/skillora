name: Skillora CI Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Static Type Check
        run: npm run type-check

      - name: ESLint Code Quality
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://xrxrxgygnuqkbexzvxas.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyeHJ4Z3lnbnVxa2JleHp2eGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTM3NTYsImV4cCI6MjEwNjA2OTc1Nn0.CROromjBhBnigD9Gn4XrLRWb57lawOm1Vkwr3zlMr14' }}

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://xrxrxgygnuqkbexzvxas.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyeHJ4Z3lnbnVxa2JleHp2eGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTM3NTYsImV4cCI6MjEwNjA2OTc1Nn0.CROromjBhBnigD9Gn4XrLRWb57lawOm1Vkwr3zlMr14' }}
